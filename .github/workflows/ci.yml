# Runs on every push and pull request. GitHub provides a fresh Linux machine,
# checks out the code, and runs the steps below. A red X on a commit means one
# of these steps exited non-zero.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Allows a re-run from the Actions tab without pushing an empty commit.
  workflow_dispatch:

jobs:
  # Checks the package itself: formatting, static analysis, and unit tests.
  package:
    runs-on: ubuntu-latest
    strategy:
      # Report both ends rather than stopping at the first failure; which end
      # breaks is the useful information.
      fail-fast: false
      matrix:
        # Both ends of the range the pubspec advertises. Pub resolves by SDK, so
        # 3.11.0 exercises analysis_server_plugin 0.3.24 with analyzer 14.5.0
        # and 3.13.7 exercises 0.3.25 with analyzer 14.6.0. Pinned rather than
        # `stable`, so a re-run resolves the same SDKs it did first time.
        sdk: ['3.11.0', '3.13.7']
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      # `--no-example` is required, not tidiness: a root `pub get` also resolves
      # `example/`, which depends on the Flutter SDK. This job installs Dart
      # alone, so without the flag resolution fails before any check runs. The
      # `example` job resolves it properly, with Flutter installed.
      - run: dart pub get --no-example

      # Fails if any file is not formatted, rather than reformatting silently.
      # Checked on the newest SDK only: the formatter's output is tied to the
      # SDK, so checking both would deadlock if the two ever disagree.
      - name: Check formatting
        if: matrix.sdk == '3.13.7'
        run: dart format --output=none --set-exit-if-changed .

      # Only lib, bin and test: `example` contains deliberate rule violations,
      # so analyzing it here would fail the build by design. It is checked in
      # the `example` job below instead.
      - name: Analyze
        run: dart analyze --fatal-infos lib bin test

      - run: dart test

  # Loads the plugin into a real Flutter app and asserts it still reports what
  # it should. This is what catches the plugin failing to load at all -- unit
  # tests exercise the rules directly and would still pass.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable

      - name: Resolve the example
        working-directory: example
        run: flutter pub get

      # `dart analyze` exits 0 for info-level diagnostics, so compare the count
      # instead. `flutter analyze` is not used: it silently drops plugin
      # diagnostics (flutter/flutter#193203).
      - name: Expect exactly 4 diagnostics
        working-directory: example
        run: |
          dart analyze > analysis.txt 2>&1 || true
          cat analysis.txt
          count=$(grep -cE 'raw_box_dimension|raw_edge_insets|raw_font_size' analysis.txt || true)
          echo "Found $count plugin diagnostics (expected 4)."
          test "$count" -eq 4

  # Confirms the plugin still loads on the oldest SDK the pubspec advertises.
  # The `example` app cannot be reused here: it contains a dot shorthand that
  # resolves through redirecting factories Flutter added to `EdgeInsetsGeometry`
  # later, so it does not compile on Flutter 3.41 at all.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # The oldest Flutter that ships Dart 3.11.
          flutter-version: 3.41.2
          channel: stable

      - name: Resolve the floor check
        working-directory: tool/floor_check
        run: flutter pub get

      - name: Expect exactly 3 diagnostics
        working-directory: tool/floor_check
        run: |
          dart analyze > analysis.txt 2>&1 || true
          cat analysis.txt
          count=$(grep -cE 'raw_box_dimension|raw_edge_insets|raw_font_size' analysis.txt || true)
          echo "Found $count plugin diagnostics (expected 3)."
          test "$count" -eq 3
